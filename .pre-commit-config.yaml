repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v3.4.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml

- repo: local
  hooks:
  - id: pylint
    name: Pylint application files
    entry: python -m pylint app.py model.py
    language: system
    pass_filenames: false
    always_run: true
